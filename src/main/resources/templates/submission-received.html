<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Submission Received</title><link rel="stylesheet" href="/css/site.css"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="success-page"><div class="success-mark">✓</div><span class="eyebrow">SUBMISSION RECEIVED</span><h1>Thank you for sharing.</h1><p>Your story has been submitted for admin review. It will not appear publicly until your mobile number and email are verified and the story is approved.</p><div class="reference-box" th:if="${referenceNumber}"><small>YOUR SUBMISSION REFERENCE</small><strong th:text="${referenceNumber}">KAL-REFERENCE</strong><button class="button button-outline" type="button" onclick="navigator.clipboard.writeText(document.getElementById('ref').innerText)" id="copyRef">Copy reference</button><span id="ref" hidden th:text="${referenceNumber}"></span></div><a class="button" href="/">Back to homepage</a></main></body></html>
