<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${post.title} + ' | Kalahandi Connect'">News Story</title><link rel="stylesheet" href="/css/site.css"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="article-layout"><a class="text-link" href="/">← All news</a><span class="category-pill static-pill" th:text="${post.category}">Category</span><h1 th:text="${post.title}">News title</h1><div class="article-meta"><span th:text="${post.location}">Location</span><span>·</span><span th:text="${post.createdAt}">Date</span></div><div class="article-images" th:if="${!#lists.isEmpty(post.imageUrls)}"><img th:each="url : ${post.imageUrls}" th:src="${url}" alt="News photograph"></div><div class="article-copy" th:text="${post.description}"></div><p class="fine-print">Contact details of the submitter are kept private.</p></main></body></html>
