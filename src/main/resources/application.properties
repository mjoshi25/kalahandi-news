# Kalahandi Connect application configuration
server.port=${PORT:8080}
spring.application.name=kalahandi-connect

spring.data.mongodb.uri=${MONGODB_URI}


# News photo uploads (values can be supplied as environment variables)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# Thymeleaf
spring.thymeleaf.cache=false

# Helpful diagnostics during local development
logging.level.in.asmj.kalahandiconnect=INFO
APP_ADMIN_USERNAME=${APP_ADMIN_USERNAME}
APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD}
